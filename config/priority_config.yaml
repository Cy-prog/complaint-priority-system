priority_weights:
  severity: 0.30
  impact: 0.20
  safety: 0.20
  service_disruption: 0.15
  duration: 0.10
  vulnerability: 0.05

priority_thresholds:
  CRITICAL: 75
  HIGH: 55
  MEDIUM: 35
  LOW: 0

sla_policies:
  CRITICAL:
    response_hours: 1
    resolution_hours: 4
  HIGH:
    response_hours: 4
    resolution_hours: 24
  MEDIUM:
    response_hours: 24
    resolution_hours: 72
  LOW:
    response_hours: 72
    resolution_hours: 168

confidence_thresholds:
  high: 0.80
  medium: 0.60
  low: 0.40

escalation_rules:
  auto_escalate_on_breach: true
  max_escalation_level: CRITICAL
  escalation_step: 1  # levels to escalate
