<!-- Mobile Bottom Native Navigation Bar -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-navy-950/95 border-t border-slate-700/80 backdrop-blur-xl shadow-2xl py-1 px-2 flex justify-around items-center text-slate-400 select-none pb-safe">
    {% set cur_path = request.url.path if request else '/' %}

    <!-- 1. Dashboard -->
    <a href="/" class="flex flex-col items-center py-1 px-2.5 rounded-xl transition {{ 'text-saffron-500 font-bold' if cur_path == '/' else 'hover:text-slate-200' }}">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px]">डैशबोर्ड</span>
    </a>

    <!-- 2. New Complaint Portal (Highlighted action) -->
    <a href="/portal" class="flex flex-col items-center -mt-4 group">
        <div class="w-12 h-12 rounded-full gradient-saffron flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition transform border-2 border-slate-900">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span class="text-[10px] font-bold text-saffron-400 mt-0.5">शिकायत दर्ज</span>
    </a>

    <!-- 3. Status Tracking -->
    <a href="/portal/track" class="flex flex-col items-center py-1 px-2.5 rounded-xl transition {{ 'text-saffron-500 font-bold' if cur_path.startswith('/portal/track') else 'hover:text-slate-200' }}">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        <span class="text-[10px]">स्थिति जांच</span>
    </a>

    <!-- 4. Gwalior GIS Map -->
    <a href="/map" class="flex flex-col items-center py-1 px-2.5 rounded-xl transition {{ 'text-saffron-500 font-bold' if cur_path == '/map' else 'hover:text-slate-200' }}">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        <span class="text-[10px]">ग्वालियर मैप</span>
    </a>

    <!-- 5. Login / Profile -->
    <a href="/login" class="flex flex-col items-center py-1 px-2.5 rounded-xl transition {{ 'text-saffron-500 font-bold' if cur_path == '/login' else 'hover:text-slate-200' }}">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px]">अधिकारी</span>
    </a>
