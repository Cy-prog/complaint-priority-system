<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Track Complaint</title></head>
<body>
<div layout:fragment="content">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card glass-card">
                <div class="card-header text-center">
                    <h4 class="mb-0"><i class="bi bi-search me-2"></i>Track Your Complaint</h4>
                    <p class="text-muted mb-0 mt-1">Enter your ticket ID to see the current status</p>
                </div>
                <div class="card-body">
                    <form th:action="@{/citizen/track}" method="get">
                        <div class="input-group input-group-lg">
                            <input type="text" name="ticketId" class="form-control" placeholder="e.g. GWA-1234"
                                   th:value="${param.ticketId}" style="text-transform: uppercase">
                            <button type="submit" class="btn btn-accent">
                                <i class="bi bi-search me-1"></i>Track
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Result -->
            <div th:if="${complaint}" class="card glass-card mt-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0" th:text="${complaint.ticketId}">GWA-1234</h5>
                        <span class="status-badge" th:classappend="'status-' + ${complaint.status.name().toLowerCase()}" th:text="${complaint.status}">Status</span>
                    </div>
                    <p th:text="${complaint.description}" class="mb-3">Description</p>

                    <div class="row g-2 mb-3" th:if="${complaint.priority}">
                        <div class="col-6">
                            <small class="text-muted">Priority</small>
                            <p><span class="priority-badge" th:classappend="'priority-' + ${complaint.priority.name().toLowerCase()}" th:text="${complaint.priority}">P</span></p>
                        </div>
                        <div class="col-6" th:if="${complaint.category}">
                            <small class="text-muted">Category</small>
                            <p><span class="badge bg-info" th:text="${complaint.category}">Cat</span></p>
                        </div>
                    </div>

                    <!-- Mini timeline -->
                    <div th:if="${statusHistory}" class="mt-3">
                        <h6><i class="bi bi-clock-history me-1"></i>Timeline</h6>
                        <div class="timeline">
                            <div class="timeline-item" th:each="h : ${statusHistory}">
                                <div class="timeline-marker"></div>
                                <div class="timeline-content">
                                    <p class="fw-bold mb-0" th:text="${h.newStatus}">S</p>
                                    <small class="text-muted" th:text="${#temporals.format(h.changedAt, 'dd MMM HH:mm')}">D</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
