<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Error - CivicPulse</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card glass-card border-0 shadow-lg text-center p-4">
                    <div class="card-body">
                        <div class="mb-3">
                            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 3.5rem;"></i>
                        </div>
                        <h3 class="fw-bold text-light mb-2">Something went wrong</h3>
                        <p class="text-secondary mb-4" th:text="${errorMessage ?: 'An unexpected issue occurred while processing your request.'}">
                            An unexpected issue occurred while processing your request.
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                                <i class="bi bi-house-door me-2"></i>Return to Dashboard
                            </a>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-2"></i>Go Back
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
