<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Audit Log</title></head>
<body>
<div layout:fragment="content">
<div class="container-fluid py-4 px-4">
    <h3 class="mb-4"><i class="bi bi-journal-text me-2"></i>Audit Log</h3>
    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Old</th><th>New</th><th>Details</th></tr></thead>
                    <tbody>
                        <tr th:each="l : ${logs.content}">
                            <td th:text="${#temporals.format(l.createdAt, 'dd MMM HH:mm')}">D</td>
                            <td th:text="${l.username ?: 'System'}">U</td>
                            <td><span class="badge bg-secondary" th:text="${l.action}">A</span></td>
                            <td th:text="${l.entityType + ' #' + l.entityId}">E</td>
                            <td class="text-truncate" style="max-width:150px" th:text="${l.oldValue ?: '—'}">O</td>
                            <td class="text-truncate" style="max-width:150px" th:text="${l.newValue ?: '—'}">N</td>
                            <td class="text-truncate" style="max-width:150px" th:text="${l.details ?: '—'}">D</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
