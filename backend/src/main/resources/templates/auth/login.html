<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Login</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-shield-check auth-icon"></i>
                <h2>CivicPulse</h2>
                <p class="text-muted">AI-Assisted Complaint Intelligence Platform</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${error}">Error</span>
            </div>
            <div th:if="${message}" class="alert alert-success py-2">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${message}">Message</span>
            </div>
            <div th:if="${param.error}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle me-1"></i> Invalid username or password
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2">
                <i class="bi bi-box-arrow-right me-1"></i> You have been logged out
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Don't have an account?</span>
                <a th:href="@{/register}" class="ms-1">Register as Citizen</a>
            </div>

            <div class="demo-credentials mt-4">
                <p class="text-muted mb-2"><small><i class="bi bi-info-circle me-1"></i>Demo Accounts:</small></p>
                <div class="row g-2">
                    <div class="col-4">
                        <div class="demo-card" onclick="fillCredentials('admin','admin123')">
                            <i class="bi bi-person-gear"></i>
                            <small>Admin</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="demo-card" onclick="fillCredentials('authority','authority123')">
                            <i class="bi bi-building"></i>
                            <small>Authority</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="demo-card" onclick="fillCredentials('citizen','citizen123')">
                            <i class="bi bi-people"></i>
                            <small>Citizen</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
<script>
function fillCredentials(username, password) {
    document.querySelector('input[name="username"]').value = username;
    document.querySelector('input[name="password"]').value = password;
}
</script>
</div>
</body>
</html>
